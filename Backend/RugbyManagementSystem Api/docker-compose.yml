services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: RugbyManagemetDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: RugbyManagement.Api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres